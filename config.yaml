# SatelliteGraph project configuration for every processing stage.
stage5:
  # null uses the first year's projected metre CRS. Set explicitly if geographic.
  target_crs: null
  output_directory: artifacts/stage5
  changes:
    minimum_area_m2: 4.0
    minimum_relative_change: 0.05
    boundary_tolerance_m: 1.0
    minimum_observed_fraction: 0.95
    minimum_confidence: 0.60
    minimum_known_fraction: 0.95
  matching:
    search_radius_m: 5.0
    minimum_iou: 0.20
    minimum_score: 0.60
    ambiguity_margin: 0.05
    minimum_visible_fraction: 0.90
    lineage_child_coverage: 0.80
    lineage_parent_coverage: 0.80
    lineage_minimum_share: 0.10
    max_assignment_cells: 4000000
# Relative paths are resolved from the repository root.
project:
  paths:
    data_directory: data
    raw_directory: data/raw          # Put source <name>.tif here.
    tiles_directory: data/tiles      # Stage 2 reads <name>/tile_XXXXX.png here.
    metadata_directory: data/metadata # Stage 2 reads <name>.csv here.
  tiling:
    tile_size: 512
    overlap: 50
    target_resolution_m: null  # null preserves original pixels; e.g. 1.5 resamples to 1.5 m
    target_crs: null           # used only in projected mode; null selects local metric CRS
    resampling: average
    resolution_mode: preserve # retain complete source footprint; geographic metre size is approximate
    edge_mode: shift          # cover final edges with full tiles; final overlap may be larger

stage2:
  instance_model:
    backend: sam2
    checkpoint: checkpoints/sam2/sam2.1_hiera_large.pt
    model_type: sam2.1_hiera_large
    # Hydra resource name inside the installed/vendored sam2 package.
    model_config: configs/sam2.1/sam2.1_hiera_l.yaml
    device: auto
    mixed_precision: true
    automatic_mask_generator:
      points_per_side: 32
      points_per_batch: 8
      pred_iou_thresh: 0.82
      stability_score_thresh: 0.90
      stability_score_offset: 1.0
      box_nms_thresh: 0.7
      crop_n_layers: 1
      crop_nms_thresh: 0.7
      crop_overlap_ratio: 0.3413333333
      crop_n_points_downscale_factor: 2
      # Uses SAM 2's compiled cleanup when available, otherwise the runner's
      # OpenCV CPU fallback (including native Windows).
      min_mask_region_area: 40
      output_mode: binary_mask
      mask_threshold: 0.0
      use_m2m: true
      multimask_output: true

  semantic_model:
    backend: openearthmap_fasterseg
    repository: third_party/oem-lightweight
    architecture: checkpoints/openearthmap/fasterseg/arch_1.pt
    checkpoint: checkpoints/openearthmap/fasterseg/weights1.pt
    device: auto
    inference:
      input_size: 1024
      use_tta: true
      save_probabilities: true

  preprocessing:
    rgb_bands: [1, 2, 3]
    normalization: percentile
    lower_percentile: 2.0
    upper_percentile: 98.0
    fixed_range: null
    nodata_fill: 0

  filtering:
    minimum_area: 40
    maximum_area_ratio: 0.95
    minimum_predicted_iou: null
    minimum_stability_score: null
    minimum_valid_pixel_fraction: 0.5
    maximum_nodata_fraction: 0.5
    minimum_fill_ratio: 0.01
    border_policy: keep

  deduplication:
    mask_iou_threshold: 0.90
    containment_threshold: 0.95
    bbox_overlap_threshold: 0.0
    area_similarity_threshold: 0.5
    duplicate_policy: keep_higher_predicted_iou
    nested_policy: remove_near_identical_only

  coverage:
    background_policy: leave_unassigned
    minimum_background_component_area: 100

  # Trees are treated like every other OpenEarthMap class. Low-confidence and
  # below-minimum residual pixels become explicit unknown components, which is
  # why the final valid-pixel coverage is always complete.
  fusion:
    minimum_sam_component_area: 40
    semantic_confidence_threshold: 0.45
    minimum_component_area:
      bareland: 100
      rangeland: 100
      developed space: 80
      road: 30
      tree: 40
      water: 80
      agriculture land: 100
      buildings: 20
    fill_low_confidence_as_unknown: true

  visualization:
    alpha: 0.45
    random_seed: 42
    show_ids: false
    show_scores: false

  output:
    root_directory: artifacts/stage2
    save_raw_masks: true
    save_rejected_masks: true
    save_intermediate_previews: true
    compressed_masks: true

# Stage 2R is a reversible refinement pass.  It never overwrites 12_final;
# accepted corrections are replayed into the sibling 13_refinement directory.
refinement:
  configuration_version: "1.0"
  # human_review: generate checksum-bound proposals and apply reviewer choices.
  # automatic: finish unattended, applying only independently gated edits and
  # preserving every abstained region unchanged.
  mode: human_review
  connectivity: 4

  ontology:
    bareland:
      entity_type: homogeneous_region
      policy: continuous_homogeneous_region
      allow_merge: true
      allow_split: true
    rangeland:
      entity_type: homogeneous_region
      policy: continuous_homogeneous_region
      allow_merge: true
      allow_split: true
    developed space:
      entity_type: homogeneous_region
      policy: continuous_homogeneous_region
      allow_merge: true
      allow_split: true
    road:
      entity_type: road_reach
      policy: junction_to_junction
      allow_merge: true
      allow_split: true
    tree:
      entity_type: continuous_canopy
      policy: continuous_canopy
      allow_merge: true
      allow_split: true
    water:
      entity_type: homogeneous_region
      policy: continuous_homogeneous_region
      allow_merge: true
      allow_split: true
    agriculture land:
      entity_type: agricultural_field
      policy: preserve_field_boundaries
      allow_merge: true
      allow_split: true
    buildings:
      entity_type: building_instance
      policy: one_physical_building
      allow_merge: true
      allow_split: true
    unknown:
      entity_type: unresolved
      policy: abstain
      allow_merge: false
      allow_split: false

  operations:
    connectivity_split:
      enabled: true
      auto_apply: true
      # Components stay separate while evidence is evaluated. Secondary pieces
      # through 40 pixels are then consolidated into the original object identity
      # instead of becoming extra graph nodes.
      minimum_component_area_pixels: 41
    semantic_split:
      enabled: true
      auto_apply: false
      minimum_segment_area_pixels: 64
      minimum_child_area_pixels: 16
      score_threshold: 0.98
      stability_trials: 3
    absorb:
      enabled: true
      auto_apply: false
      maximum_segment_area_pixels: 40
      score_threshold: 0.98
      score_margin_threshold: 0.25
      minimum_shared_boundary_fraction: 0.80
    # Automatically remove only small unknown regions for which the saved
    # semantic probabilities and a directly adjacent homogeneous class agree.
    # Protected instance/network classes stay review-only.
    unknown_cleanup:
      enabled: true
      auto_apply: true
      maximum_segment_area_pixels: 40
      allowed_target_classes:
        - bareland
        - rangeland
        - developed space
        - tree
        - water
      minimum_mean_target_probability: 0.60
      minimum_probability_margin: 0.20
      minimum_dominant_pixel_fraction: 0.90
      minimum_shared_boundary_fraction: 0.50
      minimum_weak_color_boundary_score: 0.70
      minimum_region_mean_color_similarity: 0.55
      require_not_tile_boundary: true
    # Contextual contraction handles the remaining <=40-pixel unknown noise.
    # It never targets another unknown, preserves strong standalone tree or
    # building evidence, and applies extra road/field/building policy gates.
    contextual_cleanup:
      enabled: true
      auto_apply: true
      maximum_segment_area_pixels: 40
      semantic_consensus_minimum_probability: 0.55
      semantic_consensus_minimum_margin: 0.15
      semantic_consensus_minimum_purity: 0.80
      # Relative best-neighbor selection is not enough for unattended runs:
      # require both an absolute energy ceiling and separation from runner-up.
      maximum_selected_energy: 0.40
      # Four-tile sweep: most independently supported corrections plateau at .50.
      # This ceiling only applies when every support gate below also passes.
      supported_maximum_energy: 0.50
      supported_minimum_probability: 0.20
      supported_minimum_boundary_fraction: 0.25
      supported_minimum_boundary_similarity: 0.50
      supported_minimum_region_similarity: 0.50
      minimum_energy_margin: 0.02
      standalone_tree_minimum_area_pixels: 20
      standalone_tree_minimum_probability: 0.55
      standalone_tree_minimum_margin: 0.15
      standalone_tree_minimum_purity: 0.80
      standalone_building_minimum_area_pixels: 20
      standalone_building_minimum_probability: 0.65
      standalone_building_minimum_margin: 0.20
      standalone_building_minimum_purity: 0.90
      agriculture_minimum_boundary_fraction: 0.75
      building_minimum_probability: 0.35
      road_minimum_probability: 0.30
    merge:
      enabled: true
      auto_apply: false
      minimum_shared_boundary_pixels: 8
      minimum_shared_boundary_fraction: 0.15
      score_threshold: 0.98

  evidence:
    semantic_weight: 0.35
    boundary_weight: 0.30
    appearance_weight: 0.25
    shape_weight: 0.10

  review:
    crop_padding_pixels: 32
    maximum_candidates_per_tile: 5000

  # Automatic mode intentionally does not interpret the weighted proposal
  # score as a probability. Every listed raw-evidence gate must pass, protected
  # object/network classes abstain, and overlapping proposals are resolved
  # deterministically before the normal replay validators run.
  automatic:
    policy_version: automatic_selective_v1
    protected_classes:
      - agriculture land
      - buildings
      - road
      - tree
      - unknown
    merge:
      enabled: true
      minimum_score: 0.99
      minimum_shared_boundary_pixels: 12
      minimum_shared_boundary_fraction: 0.25
      minimum_weak_color_boundary_score: 0.95
      minimum_region_mean_color_similarity: 0.95
      require_not_tile_boundary: true
    absorb:
      enabled: true
      minimum_score: 0.99
      maximum_source_area_pixels: 20
      minimum_shared_boundary_pixels: 8
      minimum_shared_boundary_fraction: 0.80
      minimum_best_to_runner_up_margin: 0.25
      minimum_weak_color_boundary_score: 0.95
      minimum_region_mean_color_similarity: 0.95
      require_same_class: true
      require_not_tile_boundary: true
    maximum_selected_operations_per_tile: 10000

  visualization:
    random_seed: 42
    alpha: 0.45

  output:
    root_directory: null
    phase_directory: 13_refinement

stage3:
  input:
    source: refinement

  # Two segments are adjacent only when their pixels share a grid edge.
  # Corner-only contact does not create an edge in the tile graph.
  adjacency:
    method: shared_edge
    connectivity: 4
    minimum_shared_boundary_pixels: 1

  # Stage 3 preserves the exact pixel-edge polygon emitted by Stage 2.
  geometry:
    simplification_tolerance: 0.0

  visualization:
    random_seed: 42
    show_ids: false
    node_size_min: 12.0
    node_size_max: 72.0
    edge_width_min: 0.5
    edge_width_max: 3.0
    edge_alpha: 0.35
    # These are display-only filters. graph.json keeps every exact segment and
    # every one-pixel shared-edge adjacency for audit and later processing.
    minimum_display_node_area_pixels: 1
    # Unknown regions through 40 pixels are retained in the authoritative
    # graph for audit but omitted from the normal analysis view.
    minimum_display_unknown_area_pixels: 41
    # Small known-class pieces created only by four-connected topology
    # normalization are omitted too; native Stage 2 objects are preserved.
    minimum_display_topology_fragment_area_pixels: 41
    minimum_display_shared_boundary_pixels: 2
    route_edges_through_contacts: true
    show_contact_anchors: false

  output:
    root_directory: artifacts/stage3

# Stage 4 combines any selected set of completed tile graphs. Exact Stage 1
# source-pixel offsets place tiles; conservative overlap-local mask matching
# reconciles duplicate objects, and coverage-aware central-pixel ownership
# removes duplicated overlap pixels before the global adjacency graph is rebuilt.
stage4:
  analysis:
    # Unresolved <=40-pixel regions remain in graph.json for audit. The normal
    # combined view uses the same minimum mapping unit as Stage 3.
    minimum_unknown_area_pixels: 41
    minimum_shared_boundary_pixels: 2
  input:
    root_directory: artifacts/stage3
    phase_directory: 01_graph
  overlap:
    method: mutual_best_mask_overlap
    minimum_intersection_pixels: 4
    minimum_intersection_over_smaller: 0.60
    minimum_intersection_over_union: 0.20
    minimum_bidirectional_coverage: 0.40
    unknown_minimum_intersection_over_smaller: 0.80
    require_same_class: true
    require_mutual_best: true
  ownership:
    method: maximum_distance_to_tile_edge_then_confidence
  adjacency:
    minimum_shared_boundary_pixels: 1
  output:
    root_directory: artifacts/stage4
